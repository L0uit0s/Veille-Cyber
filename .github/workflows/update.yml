name: Mise à jour du site

on:
  schedule:
    - cron: "*/10 * * * *"   # toutes les 10 minutes (GitHub peut retarder l'exécution)
  push:
    branches: [main]
  workflow_dispatch:          # bouton « Run workflow » dans l'onglet Actions

permissions:
  contents: read
  pages: write
  id-token: write
  actions: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Installer les dépendances
        run: pip install -r requirements.txt

      - name: Récupérer les flux
        run: python scripts/fetch.py

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Déployer sur GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      # GitHub désactive les workflows planifiés après 60 jours sans activité dans le dépôt.
      # Cette étape (au mieux) réactive le workflow pour éviter l'arrêt silencieux.
      - name: Garder le planificateur actif
        if: github.event_name == 'schedule'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X PUT "repos/${{ github.repository }}/actions/workflows/update.yml/enable"
